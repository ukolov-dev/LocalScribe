<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, initial-scale=1" />
    <title>LocalScribe social preview</title>
    <link rel="icon" href="assets/icon.png" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 640px; margin: 0; overflow: hidden; }
      body {
        display: grid;
        grid-template-columns: 490px minmax(0, 1fr);
        gap: 44px;
        padding: 54px 0 54px 62px;
        color: #111820;
        background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      }
      .copy { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
      .brand { display: flex; align-items: center; gap: 13px; font-size: 25px; font-weight: 760; letter-spacing: -.03em; }
      .brand img { width: 38px; height: 38px; border-radius: 9px; }
      h1 { margin: 0; font-size: 60px; font-weight: 730; letter-spacing: -.055em; line-height: 1.01; }
      .support { margin: 25px 0 0; color: #59636a; font-size: 21px; line-height: 1.45; }
      .repo { display: flex; align-items: center; gap: 11px; color: #2f705e; font-size: 17px; font-weight: 680; }
      .repo svg { width: 24px; height: 24px; fill: currentColor; }
      .product {
        align-self: center;
        width: 100%;
        overflow: hidden;
        border: 1px solid #cad3ce;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 22px 58px rgba(25, 48, 40, .13), 0 2px 8px rgba(25, 48, 40, .08);
      }
      .product img { display: block; width: 100%; height: auto; }
      .rule { position: absolute; right: 0; bottom: 0; left: 0; height: 10px; background: #dfece4; }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand"><img src="assets/icon.png" alt="" />LocalScribe</div>
      <div>
        <h1>Drop a recording. Keep every voice.</h1>
        <p class="support">Native menu bar · Neural speaker labels · Local processing</p>
      </div>
      <div class="repo">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.87c-2.78.6-3.37-1.18-3.37-1.18-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.35 1.09 2.92.83.09-.65.35-1.09.64-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.58 9.58 0 0 1 12 6.82c.85 0 1.71.11 2.51.34 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.86v2.76c0 .27.18.58.69.48A10 10 0 0 0 12 2Z" /></svg>
        github.com/ukolov-dev/LocalScribe
      </div>
    </div>
    <div class="product">
      <img src="assets/localscribe-menubar.svg" alt="" />
    </div>
    <div class="rule"></div>
  </body>
</html>
