[package]
name = "localscribe"
version = "0.1.2"
description = "Local audio and video transcription for macOS"
authors = ["LocalScribe"]
license = "MIT"
edition = "2021"

[lib]
name = "localscribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "localscribe"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hound = "3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
whisper-rs = { version = "0.16", features = ["metal"] }
