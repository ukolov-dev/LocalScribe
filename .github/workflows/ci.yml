name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare compile-only sidecar placeholder
        run: |
          TARGET_TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          install -m 755 /dev/null "src-tauri/binaries/ffmpeg-$TARGET_TRIPLE"

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

  ffmpeg-sidecar:
    name: Verify LGPL FFmpeg sidecar
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache FFmpeg source and build
        uses: actions/cache@v4
        with:
          path: src-tauri/target/ffmpeg-lgpl
          key: ffmpeg-lgpl-8.1.2-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg-lgpl.sh') }}

      - name: Build LGPL-only FFmpeg
        run: sh scripts/build-ffmpeg-lgpl.sh

      - name: Verify media format support
        run: sh scripts/verify-ffmpeg-sidecar.sh
