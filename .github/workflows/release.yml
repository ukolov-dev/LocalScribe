name: Signed macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos-arm64:
    name: Build, sign, notarize, and publish macOS arm64
    runs-on: macos-latest
    timeout-minutes: 90
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Cache FFmpeg source and build
        uses: actions/cache@v4
        with:
          path: src-tauri/target/ffmpeg-lgpl
          key: ffmpeg-lgpl-8.1.2-aarch64-${{ hashFiles('scripts/build-ffmpeg-lgpl.sh') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify tag matches app version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/localscribe-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/localscribe-build.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          test -n "$SIGNING_IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build and verify LGPL-only FFmpeg
        env:
          TAURI_TARGET_TRIPLE: aarch64-apple-darwin
        run: |
          npm run ffmpeg:build
          npm run ffmpeg:verify

      - name: Build signed and notarized bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_TARGET_TRIPLE: aarch64-apple-darwin
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LocalScribe ${{ github.ref_name }}"
          releaseBody: |
            Signed and notarized Apple Silicon build of LocalScribe.

            Download the DMG, open it, and drag LocalScribe to Applications.
            The exact LGPL FFmpeg source is attached to this release.
          releaseDraft: true
          prerelease: true
          generateReleaseNotes: true
          args: --target aarch64-apple-darwin --bundles app,dmg

      - name: Verify signed artifacts
        run: |
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/LocalScribe.app"
          DMG_PATH=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -d "$APP_PATH"
          test -n "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Attach exact FFmpeg source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "src-tauri/target/ffmpeg-lgpl/downloads/ffmpeg-8.1.2.tar.xz#ffmpeg-8.1.2-source.tar.xz" \
            --clobber
