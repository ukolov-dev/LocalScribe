name: Unsigned macOS prerelease

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos-arm64:
    name: Build and publish unsigned macOS arm64
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Cache FFmpeg source and build
        uses: actions/cache@v4
        with:
          path: src-tauri/target/ffmpeg-lgpl
          key: ffmpeg-lgpl-8.1.2-aarch64-${{ hashFiles('scripts/build-ffmpeg-lgpl.sh') }}

      - name: Verify tag matches app version
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Build and verify LGPL-only FFmpeg
        env:
          TAURI_TARGET_TRIPLE: aarch64-apple-darwin
        run: |
          sh scripts/build-ffmpeg-lgpl.sh
          sh scripts/verify-ffmpeg-sidecar.sh

      - name: Build native SwiftUI app
        env:
          LOCALSCRIBE_RELEASE: "1"
        run: ./script/build_and_run.sh --build-only

      - name: Package and verify native app
        run: |
          APP_PATH="macos/.build/LocalScribe.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -q 'Signature=adhoc'
          mkdir -p macos/.build/dmg
          ditto "$APP_PATH" macos/.build/dmg/LocalScribe.app
          ln -s /Applications macos/.build/dmg/Applications
          hdiutil create -volname LocalScribe -srcfolder macos/.build/dmg -format UDZO "macos/.build/LocalScribe_${GITHUB_REF_NAME}_aarch64.dmg"
          hdiutil verify "macos/.build/LocalScribe_${GITHUB_REF_NAME}_aarch64.dmg"
          ditto -c -k --keepParent "$APP_PATH" "macos/.build/LocalScribe_${GITHUB_REF_NAME}_aarch64.app.zip"
          cp src-tauri/target/ffmpeg-lgpl/downloads/ffmpeg-8.1.2.tar.xz macos/.build/ffmpeg-8.1.2-source.tar.xz
          cd macos/.build
          shasum -a 256 "LocalScribe_${GITHUB_REF_NAME}_aarch64.dmg" "LocalScribe_${GITHUB_REF_NAME}_aarch64.app.zip" ffmpeg-8.1.2-source.tar.xz > SHA256SUMS.txt

      - name: Create draft prerelease and attach artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > macos/.build/release-notes.md <<'NOTES'
          Нативный LocalScribe для macOS 13+ на Apple Silicon.

          - SwiftUI-интерфейс открывается из строки меню. Перетаскивание записи автоматически запускает расшифровку.
          - Локальная нейросетевая диаризация всегда включена: число голосов определяется автоматически, ограничения в два человека нет.
          - Сохраняются черновик, модели и настройки. Поддерживаются TXT/Markdown и импорт записей встреч.

          Откройте DMG и перенесите LocalScribe в Applications. Модели речи и спикеров загружаются отдельно с проверкой SHA-256, обработка выполняется на Mac.

          Сборка подписана ad-hoc, без Developer ID и нотариализации: macOS может потребовать разрешение на открытие. При шуме, похожих голосах и одновременной речи возможны ошибки. Проверка на чистом Mac и измерение точности на реальных встречах пока не проведены.

          Приложены DMG, ZIP приложения, SHA256SUMS.txt и точный исходный код LGPL FFmpeg.
          NOTES
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --prerelease --title "LocalScribe $GITHUB_REF_NAME (Unsigned)" --notes-file macos/.build/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "macos/.build/LocalScribe_${GITHUB_REF_NAME}_aarch64.dmg" \
            "macos/.build/LocalScribe_${GITHUB_REF_NAME}_aarch64.app.zip" \
            "macos/.build/ffmpeg-8.1.2-source.tar.xz" \
            "macos/.build/SHA256SUMS.txt" \
            --clobber
