name: Unsigned macOS prerelease

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos-arm64:
    name: Build and publish unsigned macOS arm64
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Cache FFmpeg source and build
        uses: actions/cache@v4
        with:
          path: src-tauri/target/ffmpeg-lgpl
          key: ffmpeg-lgpl-8.1.2-aarch64-${{ hashFiles('scripts/build-ffmpeg-lgpl.sh') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify tag matches app version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Build and verify LGPL-only FFmpeg
        env:
          TAURI_TARGET_TRIPLE: aarch64-apple-darwin
        run: |
          npm run ffmpeg:build
          npm run ffmpeg:verify

      - name: Build ad-hoc signed bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_TARGET_TRIPLE: aarch64-apple-darwin
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LocalScribe ${{ github.ref_name }} (Unsigned)"
          releaseBody: |
            Unsigned Apple Silicon prerelease of LocalScribe.

            Download the DMG, open it, and drag LocalScribe to Applications.
            This build is not notarized because the project does not yet have Apple Developer credentials.
            macOS Gatekeeper may require Control-clicking LocalScribe, choosing Open, and confirming once.

            LocalScribe runs transcription locally. Whisper models are downloaded on demand and verified with SHA-256.
            The exact LGPL FFmpeg source is attached to this release.
          releaseDraft: true
          prerelease: true
          generateReleaseNotes: true
          args: --target aarch64-apple-darwin --bundles app,dmg

      - name: Verify ad-hoc signed artifacts
        run: |
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/LocalScribe.app"
          DMG_PATH=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -d "$APP_PATH"
          test -n "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -q 'Signature=adhoc'
          hdiutil verify "$DMG_PATH"

      - name: Attach exact FFmpeg source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "src-tauri/target/ffmpeg-lgpl/downloads/ffmpeg-8.1.2.tar.xz#ffmpeg-8.1.2-source.tar.xz" \
            --clobber
